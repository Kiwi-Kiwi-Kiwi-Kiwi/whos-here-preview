<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Who's Here</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <h1 id="title">The Boy in the Iceberg</h1>
      <div class="cluster">
        <p id="connection">Preview (simulated playback)</p>
        <button id="reveal-all" type="button" aria-pressed="false">Reveal all</button>
      </div>
    </header>

    <div class="progress">
      <button id="play" type="button">Play</button>
      <div class="track">
        <input id="scrub" type="range" min="0" max="1365" value="200" aria-label="Episode position" />
        <div id="scene-markers"></div>
      </div>
      <span id="clock">3:20</span>
    </div>

    <div id="stage">
      <div id="map-view">
        <canvas id="globe"></canvas>
        <div id="flight-hud">
          <p id="flight-prompt" hidden>Press E to fly</p>
          <p id="flight-readout"></p>
          <p id="flight-hint"></p>
        </div>
        <div id="marker-layer"></div>
        <div id="globe-tools">
          <button id="edit-places" type="button">Edit places</button>
          <button id="copy-places" type="button" hidden>Copy JSON</button>
        </div>
        <a id="map-source" class="source-link" href="https://avatar.fandom.com/wiki/File:Avatar_world_map.jpeg" target="_blank" rel="noopener">Map source</a>
      </div>
      <div id="detail" hidden>
        <button id="back" type="button">Back to map</button>
        <div id="detail-body"></div>
      </div>
    </div>

    <section class="band">
      <h2>Assets</h2>
      <div id="assets" class="row"></div>
    </section>

    <section class="band">
      <h2>On screen</h2>
      <div id="onscreen" class="row"></div>
    </section>

    <svg id="arrow" aria-hidden="true">
      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L7,3 L0,6 Z" fill="#f4efe6"></path>
        </marker>
      </defs>
      <line id="arrow-line" marker-end="url(#arrowhead)"></line>
    </svg>
    <p id="offmap" hidden>Asset not on map</p>

    <dialog id="spoiler-dialog">
      <form method="dialog">
        <h3>Show every spoiler?</h3>
        <p>
          Reveal all uncovers facts from later in this episode and from later episodes, including things the
          characters have not reached yet.
        </p>
        <div class="dialog-actions">
          <button value="cancel" type="submit">Cancel</button>
          <button value="confirm" class="confirm" type="submit">Confirm</button>
        </div>
      </form>
    </dialog>

    <script src="lookup.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
